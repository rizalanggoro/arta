name: Build and Release Android Application

on:
  # push:
  #   paths:
  #     - "android/**"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get current date and commit hash
        id: date_and_hash
        run: |
          echo "date=$(date +'%Y-%m-%d-%H-%M')" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create .env for CI
        run: |
          echo "BASE_URL=\"${{ secrets.API_BASE_URL }}\"" >> .env
        working-directory: ./android

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Decode signing key
        working-directory: ./android
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p app/
          echo $SIGNING_KEY_BASE64 | base64 --decode > app/release.jks

      - name: Build with Gradle
        run: ./gradlew assembleRelease
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release and notify API
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG_NAME="build-${{ steps.date_and_hash.outputs.date }}-${{ steps.date_and_hash.outputs.hash }}"
          RELEASE_NAME="Continuous Integration Build"
          VERSION_CODE=$(grep -m1 -E '^\s*versionCode\s*=' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/')
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          APK_NAME=$(basename "$APK_PATH")

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "Automated release from commit ${{ github.sha }}" \
            --target "$GITHUB_SHA" \
            "$APK_PATH"

          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$APK_NAME"

          curl --fail --silent --show-error --request POST \
            "$API_BASE_URL/api/release" \
            --header "Content-Type: application/json" \
            --data "{\"url\":\"$RELEASE_URL\",\"version_code\":$VERSION_CODE}"
        working-directory: ./android
