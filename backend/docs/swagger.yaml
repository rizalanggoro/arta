host: localhost:3000
info:
  contact: {}
  description: API untuk aplikasi manajemen keuangan dan pencatatan emas - ARTA
  title: ARTA API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Validate credentials and issue a session token.
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      summary: Login a user
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Delete the current session token.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LogoutRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Logout current session
      tags:
      - auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: Return the authenticated user's profile.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MeRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Get current user
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new account and issue the first session token.
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/RegisterRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      summary: Register a new user
      tags:
      - auth
  /api/category:
    get:
      consumes:
      - application/json
      operationId: ListCategories
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.ListCategoriesRes'
      tags:
      - category
    post:
      consumes:
      - application/json
      operationId: CreateCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreateCategoryRes'
      tags:
      - category
  /api/category/{id}:
    delete:
      consumes:
      - application/json
      operationId: DeleteCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeleteCategoryRes'
      tags:
      - category
    get:
      consumes:
      - application/json
      operationId: GetCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetCategoryRes'
      tags:
      - category
    put:
      consumes:
      - application/json
      operationId: UpdateCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UpdateCategoryRes'
      tags:
      - category
  /api/dashboard/cash:
    get:
      consumes:
      - application/json
      description: Return the active cash wallet name, balance summary, today totals,
        and the latest 5 transactions.
      operationId: GetCashDashboard
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: wallet_id
        in: query
        name: wallet_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CashDashboardRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Get cash dashboard overview
      tags:
      - dashboard
  /api/dashboard/gold:
    get:
      consumes:
      - application/json
      operationId: GetGoldDashboard
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: wallet_id
        in: query
        name: wallet_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GoldDashboardRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      tags:
      - dashboard
  /api/gold:
    get:
      consumes:
      - application/json
      operationId: ListGolds
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gold.ListGoldsRes'
      tags:
      - gold
    post:
      consumes:
      - application/json
      operationId: CreateGold
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gold.CreateGoldReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreateGoldRes'
      tags:
      - gold
  /api/gold/{id}:
    delete:
      consumes:
      - application/json
      operationId: DeleteGold
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: gold id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeleteGoldRes'
      tags:
      - gold
    get:
      consumes:
      - application/json
      operationId: GetGold
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: gold id
        in: path
        name: id
        required: true
        type: integer
