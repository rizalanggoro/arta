        required: true
        schema:
          $ref: '#/definitions/gold.CreateGoldReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreateGoldRes'
      tags:
      - gold
  /api/gold/{id}:
    delete:
      consumes:
      - application/json
      operationId: DeleteGold
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: gold id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeleteGoldRes'
      tags:
      - gold
    get:
      consumes:
      - application/json
      operationId: GetGold
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: gold id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetGoldRes'
      tags:
