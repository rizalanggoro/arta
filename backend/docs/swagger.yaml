basePath: /api
definitions:
  CashDashboardRes:
    properties:
      active_wallet_name:
        type: string
      financial_summary:
        properties:
          current_balance:
            type: number
          today_expense:
            type: number
          today_income:
            type: number
        type: object
      recent_transactions:
        items:
          properties:
            category:
              $ref: '#/definitions/domain.Category'
            data:
              $ref: '#/definitions/domain.Transaction'
          type: object
        type: array
    type: object
  CreateCategoryRes:
    properties:
      data:
        $ref: '#/definitions/domain.Category'
    type: object
  CreateGoldRes:
    properties:
      data:
        $ref: '#/definitions/domain.Gold'
      profit:
        type: number
      sell_price:
        type: number
    type: object
  CreateGoldTaxPreferenceRes:
    properties:
      preference:
        $ref: '#/definitions/dto.GoldTaxPreference'
    type: object
  DeleteCategoryRes:
    properties:
      message:
        type: string
    type: object
  DeleteGoldRes:
    properties:
      message:
        type: string
    type: object
  DeleteGoldTaxPreferenceRes:
    properties:
      message:
        type: string
    type: object
  GetCategoryRes:
    properties:
      data:
        $ref: '#/definitions/domain.Category'
    type: object
  GetGoldRes:
    properties:
      data:
        $ref: '#/definitions/domain.Gold'
      profit:
        type: number
      sell_price:
        type: number
    type: object
  GoldDashboardRes:
    properties:
      active_wallet_name:
        type: string
      buy_price:
        type: number
      latest_dollar_price:
        type: number
      latest_gold_price_per_gram_idr:
        type: number
      profit:
        type: number
      recent_golds:
        items:
          $ref: '#/definitions/dto.Gold'
        type: array
      total_asset:
        type: number
      total_gold_items:
        type: integer
      total_weight:
        type: number
    type: object
  GoldSummaryRes:
    properties:
      total_grams:
        type: number
      total_value:
        type: number
    type: object
  ListGoldTaxPreferencesRes:
    properties:
      preferences:
        items:
          $ref: '#/definitions/dto.GoldTaxPreference'
        type: array
    type: object
  LoginReq:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  LoginRes:
    properties:
      email:
        type: string
      name:
        type: string
      token:
        type: string
      user_id:
        type: string
    type: object
  LogoutRes:
    properties:
      message:
        type: string
    type: object
  MeRes:
    properties:
      data:
        $ref: '#/definitions/domain.User'
      updated_at:
        type: string
    type: object
  RegisterReq:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  RegisterRes:
    properties:
      email:
        type: string
      name:
        type: string
      token:
        type: string
      user_id:
        type: string
    type: object
  UpdateCategoryRes:
    properties:
      data:
        $ref: '#/definitions/domain.Category'
    type: object
  UpdateGoldRes:
    properties:
      data:
        $ref: '#/definitions/domain.Gold'
      profit:
        type: number
      sell_price:
        type: number
    type: object
  UpdateGoldTaxPreferenceRes:
    properties:
      preference:
        $ref: '#/definitions/dto.GoldTaxPreference'
    type: object
  category.CreateCategoryReq:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  category.ListCategoriesRes:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.Category'
        type: array
    type: object
  category.UpdateCategoryReq:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  domain.Category:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        description: income, expense
        type: string
      updated_at:
        type: string
      user_id:
        description: nil for default categories
        type: integer
    type: object
  domain.Gold:
    properties:
      carat:
        type: number
      created_at:
        type: string
      date:
        type: string
      grams:
        type: number
      id:
        type: integer
      notes:
        type: string
      price:
        type: number
      type:
        description: pure_gold or jewelry
        type: string
      updated_at:
        type: string
      wallet_id:
        type: integer
    type: object
  domain.Transaction:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      updated_at:
        type: string
      wallet_id:
        type: integer
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      wallets:
        items:
          $ref: '#/definitions/domain.Wallet'
        type: array
    type: object
  domain.Wallet:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      updatedAt:
        type: string
      userID:
        type: integer
    type: object
  dto.Category:
    properties:
      data:
        $ref: '#/definitions/domain.Category'
    type: object
  dto.Error:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  dto.Gold:
    properties:
      data:
        $ref: '#/definitions/domain.Gold'
      profit:
        type: number
      sell_price:
        type: number
    type: object
  dto.GoldTaxPreference:
    properties:
      carat:
        type: number
      created_at:
        type: string
      id:
        type: integer
      tax_rate:
        type: number
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  gold.CreateGoldReq:
    properties:
      carat:
        type: number
      date:
        type: string
      grams:
        type: number
      notes:
        type: string
      price:
        description: Price is the total purchase price for the recorded grams
        type: number
      type:
        type: string
      wallet_id:
        type: integer
    type: object
  gold.GoldTaxPreferenceReq:
    properties:
      carat:
        type: number
      tax_rate:
        type: number
    type: object
  gold.ListGoldsRes:
    properties:
      golds:
        items:
          $ref: '#/definitions/dto.Gold'
        type: array
    type: object
  gold.UpdateGoldReq:
    properties:
      carat:
        type: number
      date:
        type: string
      grams:
        type: number
      notes:
        type: string
      price:
        type: number
      type:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: API untuk aplikasi manajemen keuangan dan pencatatan emas - ARTA
  title: ARTA API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Validate credentials and issue a session token.
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      summary: Login a user
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Delete the current session token.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LogoutRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Logout current session
      tags:
      - auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: Return the authenticated user's profile.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MeRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Get current user
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new account and issue the first session token.
      parameters:
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/RegisterRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      summary: Register a new user
      tags:
      - auth
  /api/category:
    get:
      consumes:
      - application/json
      operationId: ListCategories
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.ListCategoriesRes'
      tags:
      - category
    post:
      consumes:
      - application/json
      operationId: CreateCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreateCategoryRes'
      tags:
      - category
  /api/category/{id}:
    delete:
      consumes:
      - application/json
      operationId: DeleteCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeleteCategoryRes'
      tags:
      - category
    get:
      consumes:
      - application/json
      operationId: GetCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GetCategoryRes'
      tags:
      - category
    put:
      consumes:
      - application/json
      operationId: UpdateCategory
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UpdateCategoryRes'
      tags:
      - category
  /api/dashboard/cash:
    get:
      consumes:
      - application/json
      description: Return the active cash wallet name, balance summary, today totals,
        and the latest 5 transactions.
      operationId: GetCashDashboard
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Selected cash wallet ID
        in: query
        name: wallet_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CashDashboardRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Get cash dashboard overview
      tags:
      - dashboard
  /api/dashboard/gold:
    get:
      consumes:
      - application/json
      description: Return the active gold wallet name, asset summary, current prices,
        and the latest 5 gold entries.
      operationId: GetGoldDashboard
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GoldDashboardRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Error'
      security:
      - Bearer: []
      summary: Get gold dashboard overview
      tags:
      - dashboard
  /api/gold:
    get:
      consumes:
      - application/json
      operationId: ListGolds
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
